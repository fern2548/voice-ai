# ไฟล์ตั้งค่าสำหรับ Render (Blueprint)
# ใช้สร้าง "เว็บ" (static site) โดยไม่ต้องกรอกฟอร์มเอง
#
# วิธีใช้: ที่ Render กด New + -> Blueprint -> เลือก repo นี้ -> Apply
#
# หมายเหตุ: ไฟล์นี้กำหนดเฉพาะตัวเว็บ ส่วน backend (service ชื่อ voice-ai)
# สร้างด้วยมือไว้แล้ว จึงไม่ใส่ไว้ที่นี่ กันไม่ให้ไปทับของเดิม
services:
  - type: web
    name: farmy-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # ที่อยู่ของ backend ที่เว็บจะเรียกข้อมูล
      #
      # ชี้มาที่กล่อง เพราะข้อมูลฟาร์มทั้งหมดย้ายมาอยู่ในฐานข้อมูลของกล่องแล้ว
      # ถ้ายังชี้ไป voice-ai-q94g.onrender.com เว็บนี้จะอ่าน Supabase คลาวด์ซึ่งหยุดอัปเดตไปแล้ว
      # แล้วจะกลายเป็นว่ามีข้อมูลสองชุดไม่ตรงกัน ใครบันทึกผ่านเว็บนี้ข้อมูลจะไม่ถึงกล่อง
      - key: VITE_API_BASE
        value: https://fern.plotnexuslab.com
    headers:
      # ไฟล์ใน assets มีรหัสเวอร์ชันอยู่ในชื่อไฟล์อยู่แล้ว เก็บยาวได้ไม่มีปัญหา
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # ส่วน index.html ห้ามเก็บ ต้องถามเซิร์ฟเวอร์ทุกครั้งว่ามีของใหม่ไหม
      # ไม่งั้นพอ deploy เสร็จ เบราว์เซอร์กับ CDN จะยังจำไฟล์เก่าไว้
      # แล้วไปโหลด js ตัวเก่าตาม ทั้งที่ของใหม่ขึ้นแล้ว (เคยทำให้สับสนมาหลายรอบ)
      - path: /*
        name: Cache-Control
        value: no-cache

    routes:
      # จำเป็น: เว็บใช้ React Router ทุก path ต้องส่งกลับไปที่ index.html
      # ถ้าไม่มีบรรทัดนี้ กด F5 หรือเปิด /vaccine ตรง ๆ จะขึ้น 404
      - type: rewrite
        source: /*
        destination: /index.html
