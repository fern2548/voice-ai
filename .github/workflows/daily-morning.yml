# แจ้งงานและวัคซีนของวันนี้เข้ากลุ่ม LINE ทุกเช้า
#
# ทำไมต้องใช้ตัวตั้งเวลาข้างนอก: เซิร์ฟเวอร์แพ็กเกจฟรีของ Render หลับเองเมื่อไม่มีคนใช้
# ตัวตั้งเวลาที่รันในเซิร์ฟเวอร์เองจึงไม่ทำงานตอนหลับ ต้องมีคนมาเคาะจากข้างนอก
# (GitHub Actions ฟรีสำหรับ repo สาธารณะ)
#
# ตั้งค่า: Settings > Secrets and variables > Actions
#   API_BASE = ที่อยู่เซิร์ฟเวอร์ เช่น https://fern.plotnexuslab.com (ห้ามมี / ปิดท้าย)
#   CRON_KEY = ค่าเดียวกับ CRON_KEY ใน .env ของเซิร์ฟเวอร์
name: งานและวัคซีนประจำเช้า

on:
  schedule:
    # GitHub ใช้เวลา UTC — 00:00 UTC = 07:00 น. ตามเวลาไทย
    - cron: '0 0 * * *'
  workflow_dispatch:  # กดสั่งเองได้จากแท็บ Actions ไว้ทดสอบ

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: ปลุกเซิร์ฟเวอร์ให้ตื่นก่อน
        # เซิร์ฟเวอร์ที่หลับอยู่ใช้เวลาตื่นราวครึ่งนาที ถ้ายิงงานจริงเลยจะไม่ทัน
        #
        # ห้ามให้ขั้นนี้ล้มแล้วพาทั้งงานตาย ถ้าปลุกไม่ติดก็ยังต้องได้ลองส่งต่อ
        # (เคยเกิดมาแล้ว ขั้นนี้ล้มติดกันหลายวัน ขั้นส่งแจ้งเตือนเลยถูกข้ามหมดโดยไม่มีใครรู้)
        continue-on-error: true
        run: |
          curl -sS --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
            "${{ secrets.API_BASE }}/health" > /dev/null

      - name: มอบหมายงานของวันนี้ให้คนงาน
        # สร้างงานประจำของวันนี้ให้เองด้วย แล้วส่งรายการแยกตามคนรับผิดชอบ
        run: |
          curl -sS --fail-with-body --max-time 90 \
            -X POST "${{ secrets.API_BASE }}/cron/task-notify" \
            -H "X-Cron-Key: ${{ secrets.CRON_KEY }}"

      - name: แจ้งวัคซีนที่ต้องฉีดวันนี้
        # ส่งเฉพาะวันที่มีของต้องฉีดจริง วันไหนไม่มีจะเงียบ ไม่รบกวนกลุ่ม
        run: |
          curl -sS --fail-with-body --max-time 60 \
            -X POST "${{ secrets.API_BASE }}/cron/vaccine-today-notify" \
            -H "X-Cron-Key: ${{ secrets.CRON_KEY }}"

      - name: แจ้งรายการที่ต้องไปตรวจอาการหลังฉีด
        # แยกข้อความกัน คนอ่านจะได้รู้ว่าอันไหน "ต้องไปฉีด" อันไหน "ต้องไปดูอาการ"
        run: |
          curl -sS --fail-with-body --max-time 60 \
            -X POST "${{ secrets.API_BASE }}/cron/vaccine-followup-notify" \
            -H "X-Cron-Key: ${{ secrets.CRON_KEY }}"
