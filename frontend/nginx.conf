server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # เว็บนี้มีหน้าเดียวแล้วสลับเนื้อหาเอง
  # ถ้าไม่ส่งทุกที่อยู่กลับมาที่ index.html การเปิด /vaccine ตรง ๆ จะเจอ 404
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ไฟล์ที่มีชื่อติดรหัสอยู่แล้ว เก็บแคชยาวได้ ไม่ต้องโหลดซ้ำทุกครั้ง
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
