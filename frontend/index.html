<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ฟาร์มมี่ (Farmy)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"
  />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- AI ตัวแยก (farmy-voice-ai) — โชว์กล่องเสียงลอยอีกอันฝั่งซ้าย เฉพาะเมื่อตั้ง VITE_VOICE_AI_URL
       ไว้ให้เทียบกับ AI ในตัวของ Farmy (ปุ่มขวา) ไม่ตั้งค่า = ไม่มีอะไรเปลี่ยน -->
  <script>
    (function () {
      var url = '%VITE_VOICE_AI_URL%'
      if (!url || url.charAt(0) === '%') return
      var s = document.createElement('script')
      s.src = url + '/farmy-voice-widget.js'
      s.dataset.server = url
      s.dataset.position = 'left'
      s.dataset.title = 'AI ตัวแยก (' + url.replace(/^https?:\/\//, '') + ')'
      // รายชื่อหน้าของ Farmy ให้สั่ง "เปิดหน้า…" ได้ (คำที่พูด → URL)
      s.dataset.pages = '{"หน้าแรก|หน้าหลัก":"/overview","วัคซีน|บันทึกวัคซีน|ฉีดยา":"/vaccine","โรงเรือน|หมูป่วย":"/pig-log","รายงาน|ย้อนหลัง":"/history","พยากรณ์":"/forecast","แนวโน้ม|เทียบ":"/trend","กราฟข้อมูล|กราฟ|เซนเซอร์":"/sensors","คลังความรู้|เอกสาร":"/knowledge","ตั้งค่า":"/settings"}'
      document.body.appendChild(s)
    })()
  </script>
</body>
</html>
