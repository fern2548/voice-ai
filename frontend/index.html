<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ฟาร์มมี่ (Farmy)</title>
  <!-- ติดตั้งเป็นแอป (PWA): ไอคอนบนหน้าจอหลัก เปิดเต็มจอ -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#08090e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Farmy Voice" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <!--
    ฟอนต์กับไอคอนเก็บไว้ในโปรเจกต์เอง ไม่ดึงจาก CDN ข้างนอก

    เดิมโหลดจาก fonts.googleapis.com และ cdn.jsdelivr.net ซึ่งเบราว์เซอร์ของผู้ใช้
    เป็นคนไปโหลด ไม่ใช่เซิร์ฟเวอร์ ฟาร์มที่เน็ตไม่ถึงหรือเครือข่ายบริษัทบล็อก CDN ไว้
    จะเห็นหน้าเว็บไม่มีไอคอนสักตัวและฟอนต์ไทยเพี้ยน
    อัปเดตไฟล์ได้ด้วย: ดูวิธีใน frontend/public/vendor/อ่านก่อน.md
  -->
  <link rel="stylesheet" href="/vendor/fonts/font.css" />
  <link rel="stylesheet" href="/vendor/tabler/font.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- AI ตัวแยก (farmy-voice-ai) — โชว์กล่องเสียงลอยอีกอันฝั่งซ้าย เฉพาะเมื่อตั้ง VITE_VOICE_AI_URL
       ไว้ให้เทียบกับ AI ในตัวของ Farmy (ปุ่มขวา) ไม่ตั้งค่า = ไม่มีอะไรเปลี่ยน -->
  <script>
    (function () {
      var url = '%VITE_VOICE_AI_URL%'
      if (!url || url.charAt(0) === '%') return
      var s = document.createElement('script')
      s.src = url + '/farmy-voice-widget.js'
      s.dataset.server = url
      s.dataset.position = 'left'
      s.dataset.title = 'AI ตัวแยก (' + url.replace(/^https?:\/\//, '') + ')'
      // รายชื่อหน้าของ Farmy ให้สั่ง "เปิดหน้า…" ได้ (คำที่พูด → URL)
      s.dataset.pages = '{"หน้าแรก|หน้าหลัก":"/overview","อาการปากเท้าเปื่อย|ลักษณะโรคปากเท้าเปื่อย":"/diseases/fmd","รวมทุกเมนู|ทุกเมนู|เมนูทั้งหมด":"/menu","เช็กลิสต์|เช็คลิสต์|มาตรฐานฟาร์ม|รายการตรวจ":"/checklist","ทำความสะอาดโรงเรือน|ล้างโรงเรือน|ฆ่าเชื้อ|ความปลอดภัยทางชีวภาพ":"/cleaning","การผสมพันธุ์|ผสมพันธุ์|สายพันธุ์หมู":"/breeding","อาหารสัตว์|สูตรอาหาร|ผสมอาหาร":"/feed","อาการของโรค|อาการโรค|ลักษณะโรค":"/diseases","วิธีฉีดวัคซีน|วิธีฉีด|ตำแหน่งฉีด":"/vaccine-guide","แผนวัคซีน|วัคซีนตามอายุ":"/vaccine-plan","งานวันนี้|งานที่ต้องทำ|รายการงาน":"/tasks","ปรึกษาสัตวแพทย์|ปรึกษาหมอ|ถามหมอ":"/vet","วัคซีน|บันทึกวัคซีน|ฉีดยา":"/vaccine","โรงเรือน|หมูป่วย":"/pig-log","รายงาน|ย้อนหลัง":"/history","พยากรณ์":"/forecast","แนวโน้ม|เทียบ":"/trend","กราฟข้อมูล|กราฟ|เซนเซอร์":"/sensors","ตั้งค่า":"/settings"}'
      document.body.appendChild(s)
    })()
  </script>
</body>
</html>
