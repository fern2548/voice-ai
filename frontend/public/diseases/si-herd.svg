  <text x="200" y="62" text-anchor="middle" font-family="IBM Plex Sans Thai, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#c0392b">ไอพร้อมกันเกือบทั้งคอก</text>
  <text x="200" y="88" text-anchor="middle" font-family="IBM Plex Sans Thai, Segoe UI, sans-serif" font-size="15" fill="#5b4a44">ลามเร็วภายใน 1–3 วัน</text>

  <text x="200" y="286" text-anchor="middle" font-family="IBM Plex Sans Thai, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#5b4a44">ไอทั้งคอก ลามเร็ว</text>
</svg>
