# ประตูหน้าบ้าน — แปลงที่อยู่ให้เหมือน Supabase
#
# โค้ดเราเรียกผ่านไลบรารีของ Supabase ซึ่งจะยิงไปที่ /rest/v1/<ชื่อตาราง> เสมอ
# แต่ PostgREST รับที่ราก / เฉย ๆ ตัวนี้จึงทำหน้าที่ตัดคำนำหน้าออกให้
# ผลคือโค้ดเดิมใช้ได้ทันที ไม่ต้องแก้อะไรเลยแม้เปลี่ยนจาก Supabase มาเป็นชุดนี้
server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  location /rest/v1/ {
    proxy_pass http://postgrest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    add_header Content-Type application/json;
    return 200 '{"gateway":"ok"}';
  }

  location / {
    return 404 '{"error":"not found"}';
    add_header Content-Type application/json;
  }
}
