<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmy Voice — Voice AI สำหรับฟาร์มหมูอัจฉริยะ</title>
    <meta name="description" content="Farmy Voice: ถามข้อมูลภายในฟาร์ม หรือให้พาไปยังหน้าต่าง ๆ ได้ด้วยเสียง" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- ตั้งธีมก่อน React จะ render กันจอกระพริบขาวตอนโหลดในโหมดมืด -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('farmy-voice-theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
